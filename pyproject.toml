[project]
name = "water-info"
version = "1.2.3"
description = "Display water tank capacity and temperature"
readme = "README.md"
requires-python = ">=3.13"
service_name="water-info"
launch_path="src/main.py"
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "sc-foundation-services>=3.3.0",
    "twilio>=9.10.9",
    # Base uvicorn (not [standard]) + websockets only: avoids uvloop/httptools,
    # which have no 32-bit ARM wheels and would build from source on the Pi.
    # We don't use uvloop/httptools (perf extras) or watchfiles (--reload).
    "uvicorn>=0.51.0",
    "websockets>=16.1.1",
]

[project.optional-dependencies]
all = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

